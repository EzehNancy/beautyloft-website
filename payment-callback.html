<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Payment | The BeautyLoft
  </title>

  <link
    rel="stylesheet"
    href="payment-callback.css"
  >

</head>

<body>

  <main class="payment-page">

    <section class="payment-card">

      <a
        href="index.html"
        class="payment-logo"
      >
        THE BEAUTYLOFT
      </a>


      <div
        class="payment-icon"
        id="paymentIcon"
      >
        ✓
      </div>


      <h1 id="paymentTitle">
        Verifying your payment...
      </h1>


      <p id="paymentMessage">
        Please wait while we securely confirm
        your payment.
      </p>


      <div class="payment-actions">

        <a
          href="shop-home.html"
          class="payment-button"
        >
          Continue Shopping
        </a>

        <a
          href="index.html"
          class="payment-button secondary"
        >
          Back to Home
        </a>

      </div>

    </section>

  </main>


  <script src="payment-callback.js"></script>

</body>

</html>
