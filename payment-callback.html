<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Payment | The BeautyLoft
  </title>

  <link
    rel="stylesheet"
    href="payment-callback.css"
  >

</head>

<body>

  <main class="payment-page">

    <!-- Decorative side text -->

    <div class="side-brand">
      THE BEAUTYLOFT
    </div>


    <!-- Decorative sparkle -->

    <div class="sparkle sparkle-one">
      ✦
    </div>

    <div class="sparkle sparkle-two">
      ✧
    </div>


    <section class="payment-content">


      <!-- Small brand label -->

      <a
        href="index.html"
        class="payment-logo"
      >
        THE BEAUTYLOFT
      </a>


      <!-- Success icon -->

      <div
        class="payment-icon"
        id="paymentIcon"
      >
        ✓
      </div>


      <!-- Small label -->

      <p class="payment-eyebrow">
        ORDER CONFIRMATION
      </p>


      <!-- JS changes this -->

      <h1 id="paymentTitle">
        Verifying your payment...
      </h1>


      <!-- JS changes this -->

      <p
        id="paymentMessage"
        class="payment-message"
      >
        Please wait while we securely
        confirm your payment.
      </p>


      <!-- Decorative divider -->

      <div class="payment-divider">

        <span></span>

        <span class="divider-heart">
          ♡
        </span>

        <span></span>

      </div>


      <!-- Little note -->

      <p class="thank-you-note">
        Thank you for choosing
        The BeautyLoft.
      </p>


      <!-- Buttons -->

      <div class="payment-actions">

        <a
          href="shop-home.html"
          class="payment-button"
        >
          Continue Shopping
        </a>

        <a
          href="index.html"
          class="payment-button secondary"
        >
          Back to Home
        </a>

      </div>


    </section>


    <!-- Bottom decorative text -->

    <div class="bottom-note">
      GOOD NAILS, ALWAYS A GOOD IDEA
    </div>

  </main>


  <script src="payment-callback.js"></script>

</body>

</html>
