<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wishlist — The BeautyLoft</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body class="wishlist-page-body">

<main class="wishlist-page">

  <!-- Decorative left branding -->
  <aside class="wishlist-side-brand" aria-hidden="true">
    <span class="wishlist-side-star">✦</span>
    <span class="wishlist-side-text">THE BEAUTYLOFT</span>
    <span class="wishlist-side-line"></span>
  </aside>


  <!-- HERO -->
  <section class="wishlist-page-header">

    <div class="wishlist-header-copy">

      <p class="eyebrow">Your Edit</p>

      <h1>
        Sets you've<br>
        fallen for.
      </h1>

      <p class="wishlist-page-subtitle">
        Keep your favourites close until you're ready
        to make them yours.
      </p>

    </div>


    <div class="wishlist-saved-count">

      <span id="wishlistCount">0</span>

      <div class="wishlist-count-line"></div>

      <p>Saved Sets</p>

    </div>


    <div class="wishlist-hero-note" aria-hidden="true">

      <p>
        Good nails,<br>
        always a good idea
      </p>

      <span>♡</span>

    </div>

  </section>


  <!-- PRODUCTS -->
  <section class="wishlist-content">

    <div
      class="wishlist-grid"
      id="wishlistGrid"
    >
      <p>Loading your wishlist...</p>
    </div>

  </section>


  <!-- BOTTOM DECORATION -->
  <div class="wishlist-bottom-detail" aria-hidden="true">

    <span class="wishlist-bottom-line"></span>

    <p>
      NAILS &nbsp;/&nbsp;
      BEAUTY &nbsp;/&nbsp;
      CONFIDENCE
    </p>

  </div>

</main>

  <script src="wishlist.js"></script>

</body>
</html>
